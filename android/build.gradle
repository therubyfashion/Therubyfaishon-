// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.17.0"
            force "androidx.core:core-ktx:1.17.0"
            force "androidx.activity:activity:1.11.0"
            force "androidx.activity:activity-ktx:1.11.0"
            force "androidx.core:core-splashscreen:1.0.1"
            force "androidx.fragment:fragment:1.8.6"
            force "androidx.fragment:fragment-ktx:1.8.6"
            force "androidx.lifecycle:lifecycle-runtime:2.8.4"
            force "androidx.lifecycle:lifecycle-common:2.8.4"
            force "androidx.lifecycle:lifecycle-viewmodel:2.8.4"
            force "androidx.browser:browser:1.8.0"
        }
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
