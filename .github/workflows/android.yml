name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ Node 22 (Capacitor 6 requirement)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # ✅ Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Fix Gradle wrapper (corruption fix)
      - name: Setup Gradle Wrapper
        run: |
          cd android
          rm -rf gradle/wrapper
          gradle wrapper --gradle-version 8.4 --distribution-type bin

      # ✅ Clean Gradle
      - name: Clean Gradle
        run: |
          cd android
          ./gradlew clean

      # ✅ Build APK (CI safe flags)
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ✅ Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
